name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci --omit=dev --omit=optional
      - name: Check Zig formatting
        run: zig fmt --check build.zig src
      - name: Build debug CLI
        run: zig build
      - name: Run Zig unit tests
        run: zig build test
      - name: Run Node tests
        run: node --test packages/cli/test/*.test.js test/*.test.js
      - name: Build release-safe CLI
        run: zig build -Doptimize=ReleaseSafe
      - run: ./zig-out/bin/brandpeel --version
        if: runner.os != 'Windows'
      - run: .\zig-out\bin\brandpeel.exe --version
        if: runner.os == 'Windows'
      - run: npm run pack:check
