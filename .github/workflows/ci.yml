name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run check
      - run: npm run build
      - run: ./zig-out/bin/brandpeel --version
        if: runner.os != 'Windows'
      - run: .\zig-out\bin\brandpeel.exe --version
        if: runner.os == 'Windows'
      - run: npm run pack:check
